name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and upload debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Copy web assets into Android project
        run: npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/21-Code-debug.apk
          sha256sum artifacts/21-Code-debug.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: 21-Code-Android-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
